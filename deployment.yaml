apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
  template:
    metadata:
      labels:
        app: food-portal
    spec:
      containers:
        - name: food-portal
          image: 24mis0545/food-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
