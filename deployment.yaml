
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-portal
        version: blue
    spec:
      containers:
        - name: food-portal
          image: 24mis0545/food-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      version: green
  template:
    metadata:
      labels:
        app: food-portal
        version: green
    spec:
      containers:
        - name: food-portal
          image: 24mis0545/food-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-green-test
spec:
  type: ClusterIP
  selector:
    app: food-portal
    version: green
  ports:
    - port: 80
      targetPort: 80
